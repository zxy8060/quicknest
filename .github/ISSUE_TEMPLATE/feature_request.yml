name: 功能建议
description: 提议新的使用场景或改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述场景，而不仅是界面控件。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: checkboxes
    id: boundaries
    attributes:
      label: 产品边界
      options:
        - label: 方案可以保持本地优先，不要求上传用户启动数据。
          required: true
        - label: 如果涉及删除，方案不会删除快捷项指向的原文件。
          required: true
