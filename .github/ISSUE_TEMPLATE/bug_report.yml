name: Bug 报告
description: 报告可以稳定复现的 QuickNest 问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿上传真实 `launcher.json`、访问令牌或包含隐私的完整路径清单。

  - type: input
    id: version
    attributes:
      label: QuickNest 版本
      placeholder: 例如 0.4.1
    validations:
      required: true

  - type: dropdown
    id: windows
    attributes:
      label: Windows 版本
      options:
        - Windows 11
        - Windows 10
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用不含私人路径和敏感数据的最小示例。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可提供已脱敏日志、截图或是否能稳定复现。

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认内容不包含凭据、真实 launcher.json 或不必要的个人路径。
          required: true
